<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>og-image source — 1200×630</title>
<!-- Source for og-image.png. NOT deployed — the _build folder is excluded when
     v3.2 is promoted to the site root. Regenerate with:

       python3 -m http.server 8742          # from spectrasort-info/
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
         --headless=new --disable-gpu --hide-scrollbars \
         --force-device-scale-factor=1 --window-size=1200,630 \
         --virtual-time-budget=6000 \
         --screenshot=v3.2/og-image.png \
         http://127.0.0.1:8742/v3.2/_build/og-image.html

     (Chrome writes the file and then never exits — poll for the PNG, then kill it.)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body {
    background:#0B0B0E;
    font-family:'Inter', -apple-system, sans-serif;
    color:#F4F2ED;
    position:relative;
  }
  /* spectral wash, bottom-left → the same gradient the site uses */
  .glow {
    position:absolute; inset:-20% -10% auto -20%; height:120%;
    background:
      radial-gradient(46% 52% at 14% 30%, rgba(107,127,188,0.30), transparent 68%),
      radial-gradient(40% 46% at 62% 8%, rgba(199,127,180,0.22), transparent 70%),
      radial-gradient(50% 55% at 92% 78%, rgba(232,169,106,0.22), transparent 72%);
    filter:blur(10px);
  }
  .wrap { position:relative; padding:44px 60px 0; height:100%; display:flex; flex-direction:column; }

  .brand { display:flex; align-items:center; gap:13px; }
  .brand img { width:44px; height:44px; border-radius:11px; display:block; }
  .brand span {
    font-family:'Space Grotesk', sans-serif; font-weight:600;
    font-size:24px; letter-spacing:-0.01em;
  }

  h1 {
    font-family:'Space Grotesk', sans-serif; font-weight:700;
    font-size:70px; line-height:1.03; letter-spacing:-0.03em;
    margin-top:30px; max-width:900px;
  }
  .grad {
    background:linear-gradient(92deg,#6B7FBC,#C77FB4 52%,#E8A96A);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub {
    font-size:22px; color:#A8A4AE; margin-top:18px; max-width:820px; line-height:1.45;
  }
  .chips { display:flex; gap:10px; margin-top:22px; }
  .chip {
    border:1px solid rgba(244,242,237,0.14); border-radius:999px;
    padding:8px 16px; font-size:15px; color:#A8A4AE;
  }
  .chip b { color:#F4F2ED; font-weight:600; }

  /* the ranked filmstrip — top three ringed and scored, the rest stepped back */
  .strip {
    margin-top:auto; margin-bottom:44px; display:flex; gap:12px;
  }
  .cell {
    position:relative; width:124px; height:124px; border-radius:16px;
    overflow:hidden; flex:none;
  }
  .cell img { width:100%; height:100%; object-fit:cover; display:block; }
  .cell.top { box-shadow:0 0 0 2px #E8A96A, 0 14px 34px rgba(0,0,0,0.55); }
  .cell.rest img { filter:grayscale(0.9) brightness(0.42); }
  .score {
    position:absolute; top:7px; left:7px;
    background:rgba(0,0,0,0.6); color:#fff;
    font-size:13px; font-weight:600; border-radius:8px; padding:3px 9px;
  }
  .striplabel {
    position:absolute; right:60px; bottom:96px;
    font-size:15px; color:#6E6A76; text-align:right; max-width:300px; line-height:1.4;
  }
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">
  <div class="brand">
    <img src="../images/app-icon-flat.png" alt="">
    <span>SpectraSort</span>
  </div>

  <h1>Your best photos.<br><span class="grad">Surfaced.</span></h1>
  <p class="sub">An on-device AI photo picker for iPhone. It doesn't just find your photos — it ranks them.</p>
  <div class="chips">
    <span class="chip"><b>100% on-device</b> — nothing uploaded</span>
    <span class="chip"><b>$19.99 once</b> — no subscription</span>
  </div>

  <div class="strip">
    <div class="cell top"><img src="../images/roll/roll-coast-golden.jpg" alt=""><span class="score">9.6</span></div>
    <div class="cell top"><img src="../images/roll/roll-icebergs.jpg" alt=""><span class="score">9.2</span></div>
    <div class="cell top"><img src="../images/roll/roll-city-sunset.jpg" alt=""><span class="score">8.9</span></div>
    <div class="cell rest"><img src="../images/roll/roll-flatiron.jpg" alt=""></div>
    <div class="cell rest"><img src="../images/roll/roll-blossom.jpg" alt=""></div>
    <div class="cell rest"><img src="../images/roll/roll-sunset-jump.jpg" alt=""></div>
    <div class="cell rest"><img src="../images/roll/roll-food.jpg" alt=""></div>
    <div class="cell rest"><img src="../images/roll/roll-dog.jpg" alt=""></div>
    <div class="cell rest"><img src="../images/roll/roll-portrait.jpg" alt=""></div>
  </div>
</div>
</body>
</html>
